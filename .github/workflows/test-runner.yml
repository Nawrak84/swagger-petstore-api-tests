name: Playwright Tests
run-name: PetStore API Playwright Tests

"on":
  push:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version"
        required: true
        default: "22"
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  checks: write

jobs:
  Run-Tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '22' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npx playwright test --reporter=list,junit,html
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Publish Playwright Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Playwright Test Results
          path: results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright Reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-reports
          path: |
            results.xml
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
